<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>G.C Studio Mix&Master — Gc v1/02</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#07070a;
      --line:#1e2233;
      --text:#eaf0ff;
      --muted:#a8b3d6;
      --mix:#3a82ff;     /* blue */
      --master:#ffb25a;  /* amber */
      --bad:#ff6b6b;
      --good:#52ffa8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 600px at 50% 0%, rgba(58,130,255,.10), transparent 55%),
                  radial-gradient(1200px 700px at 50% 120%, rgba(255,178,90,.06), transparent 60%),
                  var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }
    .smoke{
      pointer-events:none;
      position:fixed; inset:-20%;
      background:
        radial-gradient(700px 400px at 30% 40%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 500px at 70% 60%, rgba(255,255,255,.05), transparent 62%),
        radial-gradient(800px 500px at 50% 80%, rgba(255,255,255,.04), transparent 65%);
      filter: blur(18px);
      opacity:.35;
      animation: drift 18s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes drift{
      0%{transform:translate3d(-2%, -1%, 0) rotate(0deg)}
      50%{transform:translate3d(2%, 1%, 0) rotate(1deg)}
      100%{transform:translate3d(-2%, -1%, 0) rotate(0deg)}
    }
    header{
      position:sticky; top:0; z-index:20;
      background: linear-gradient(180deg, rgba(7,7,10,.98), rgba(7,7,10,.82));
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
      padding:14px 14px 10px;
    }
    .brand{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; max-width:980px; margin:0 auto;}
    .title{display:flex; flex-direction:column; gap:4px;}
    h1{margin:0; font-size:15px; letter-spacing:.3px}
    .sub{font-size:12px; color:var(--muted)}
    .stepbar{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted);}
    .led{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.10) inset;}
    .led.mix{background:rgba(58,130,255,.65);box-shadow:0 0 12px rgba(58,130,255,.35),0 0 0 1px rgba(58,130,255,.35) inset;}
    .led.master{background:rgba(255,178,90,.70);box-shadow:0 0 14px rgba(255,178,90,.35),0 0 0 1px rgba(255,178,90,.35) inset;}
    .led.bad{background:rgba(255,107,107,.75);box-shadow:0 0 14px rgba(255,107,107,.35),0 0 0 1px rgba(255,107,107,.35) inset;}

    main{max-width:980px; margin:0 auto; padding:14px; display:grid; gap:12px}
    .card{
      background: linear-gradient(180deg, rgba(12,13,18,.92), rgba(10,11,16,.88));
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }
    .card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 30%);pointer-events:none;}
    .rackEdge{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg, transparent, rgba(58,130,255,.40), transparent);opacity:.65;pointer-events:none;}
    .rackEdge.master{background:linear-gradient(90deg, transparent, rgba(255,178,90,.45), transparent);}
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
    .grid{display:grid; gap:10px}
    .muted{color:var(--muted); font-size:12px}
    .big{font-size:14px; font-weight:650; letter-spacing:.2px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}

    .btn{border:1px solid #2c3350;background:#070812;color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer;transition:transform .05s ease,border-color .2s ease;user-select:none;}
    .btn:hover{border-color:#3b4676}
    .btn:active{transform:translateY(1px)}
    .btn.primary{border-color:rgba(58,130,255,.55);box-shadow:0 0 0 1px rgba(58,130,255,.20) inset,0 0 18px rgba(58,130,255,.12);}
    .btn.primary.master{border-color:rgba(255,178,90,.60);box-shadow:0 0 0 1px rgba(255,178,90,.22) inset,0 0 18px rgba(255,178,90,.12);}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn.danger{border-color:rgba(255,107,107,.55);box-shadow:0 0 0 1px rgba(255,107,107,.18) inset;}

    .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid #2c3350;font-size:12px;color:var(--muted);background:rgba(0,0,0,.10);}
    .pill strong{color:var(--text);font-weight:650}
    .pill.good{border-color:rgba(82,255,168,.35);color:#bfffdc}
    .pill.bad{border-color:rgba(255,107,107,.35);color:#ffd1d1}

    .meter{height:10px;background:#070812;border:1px solid #2c3350;border-radius:999px;overflow:hidden;}
    .meter>div{height:100%;width:0%;background:linear-gradient(90deg, rgba(58,130,255,.9), rgba(255,178,90,.75));}

    .slot{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(0,0,0,.10);display:grid;gap:10px;}
    .slotTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .slotName{display:flex;align-items:center;gap:10px}
    .slotName .label{font-weight:700;letter-spacing:.2px}
    .slotHint{font-size:12px;color:var(--muted)}

    .fileList{display:grid;gap:8px}
    .fileRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px;border-radius:12px;border:1px solid #232a44;background:rgba(7,8,18,.75);}
    .fileMeta{display:grid;gap:2px}
    .fileMeta .name{font-size:12px;font-weight:650}
    .fileMeta .submeta{font-size:11px;color:var(--muted)}

    .ledBtns{display:flex;gap:8px;flex-wrap:wrap}
    .ledBtn{border:1px solid #2c3350;background:#070812;color:var(--muted);padding:7px 10px;border-radius:10px;font-size:12px;cursor:pointer;user-select:none;position:relative;transition:border-color .2s ease,color .2s ease,box-shadow .2s ease;}
    .ledBtn::before{content:"";width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.10);box-shadow:0 0 0 1px rgba(255,255,255,.10) inset;display:inline-block;margin-right:8px;vertical-align:middle;}
    .ledBtn.on{color:var(--text);border-color:rgba(58,130,255,.55);box-shadow:0 0 0 1px rgba(58,130,255,.18) inset,0 0 16px rgba(58,130,255,.10);}
    .ledBtn.on::before{background:rgba(58,130,255,.75);box-shadow:0 0 12px rgba(58,130,255,.32),0 0 0 1px rgba(58,130,255,.35) inset;}
    .masterMode .ledBtn.on{border-color:rgba(255,178,90,.62);box-shadow:0 0 0 1px rgba(255,178,90,.20) inset,0 0 16px rgba(255,178,90,.10);}
    .masterMode .ledBtn.on::before{background:rgba(255,178,90,.78);box-shadow:0 0 14px rgba(255,178,90,.35),0 0 0 1px rgba(255,178,90,.38) inset;}

    .notice{border:1px solid #2c3350;background:rgba(0,0,0,.10);padding:10px 12px;border-radius:14px;font-size:12px;color:var(--muted);line-height:1.35;}
    .notice strong{color:var(--text)}
    .notice.bad{border-color:rgba(255,107,107,.45);color:#ffd1d1}
    .notice.good{border-color:rgba(82,255,168,.35);color:#bfffdc}

    .checkboxRow{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
    input[type="checkbox"]{transform:scale(1.2)}

    .center{display:grid;place-items:center;text-align:center;gap:12px;padding:18px 14px;}
    .bigTitle{font-size:18px;font-weight:800;letter-spacing:.4px}
    .fade{opacity:.85}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div class="smoke"></div>

  <header>
    <div class="brand">
      <div class="title">
        <h1>G.C Studio Mix&Master</h1>
        <div class="sub">Gc v1/02 • After Hours Studio Wizard • Suno / AI stems only • Mix → Health Scan → Master → One Render</div>
      </div>
      <div class="stepbar">
        <span class="led mix" id="stageLed"></span>
        <span id="stepText">Step 0 of 8</span>
      </div>
    </div>
  </header>

  <main>
    <section class="card" id="screen">
      <div class="rackEdge" id="rackEdge"></div>
      <div id="content"></div>

      <div class="row" style="margin-top:12px">
        <button class="btn" id="backBtn">Back</button>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          <span class="pill"><strong>Limits</strong> ≤75MB each • ≤5:00 • same length match</span>
          <button class="btn primary" id="nextBtn">Next</button>
        </div>
      </div>
    </section>

    <section class="card" id="statusCard">
      <div class="row">
        <div style="display:grid; gap:6px">
          <div class="big">Session Status</div>
          <div class="muted" id="statusLine">Idle.</div>
        </div>
        <div style="min-width:320px; flex:1">
          <div class="muted">Progress</div>
          <div class="meter"><div id="bar"></div></div>
        </div>
      </div>
      <div class="grid" style="margin-top:10px">
        <div class="notice" id="reportBox">
          <strong>Report:</strong> Upload stems through the wizard to continue.
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  const MAX_MB_PER_FILE = 75;
  const MAX_BYTES_PER_FILE = MAX_MB_PER_FILE * 1024 * 1024;
  const MAX_SECONDS = 5 * 60;
  const SR = 48000;

  // v1/02: practical tolerance but still "same length" rule
  const DURATION_TOLERANCE_SEC = 0.20;

  const SILENT_RMS = Math.pow(10, -45/20);
  const CLIP_PEAK = 0.999;

  const $ = (id) => document.getElementById(id);
  const content = $("content");
  const backBtn = $("backBtn");
  const nextBtn = $("nextBtn");
  const stepText = $("stepText");
  const statusLine = $("statusLine");
  const bar = $("bar");
  const reportBox = $("reportBox");
  const stageLed = $("stageLed");
  const rackEdge = $("rackEdge");
  const screen = $("screen");

  const SCREENS = { WELCOME:0, HOW:1, VOCALS:2, DRUMS:3, BASS:4, INSTR:5, OTHER:6, REVIEW:7, HEALTH:8, OPTIONS:9, CONFIRM:10, RENDERING:11, DONE:12 };
  let step = SCREENS.WELCOME;
  let renderedOnce = false;
  let decodeCtx = null;

  const buckets = {
    vocals: { label:"Vocals", min:1, max:3, files:[], buffers:[], tags:[] },
    drums:  { label:"Drums",  min:1, max:1, files:[], buffers:[], tags:[] },
    bass:   { label:"Bass",   min:1, max:1, files:[], buffers:[], tags:[] },
    instr:  { label:"Instruments", min:1, max:6, files:[], buffers:[], tags:[] },
    other:  { label:"Other / FX",  min:1, max:3, files:[], buffers:[], tags:[] },
  };

  const options = { genre:"trap", resultType:"mix_master", loudness:"safe", rbVocal:"blend", trapBass:"trunk" };

  const HEALTH_COPY = {
    lowEnd: `“Low end may be heavier than ideal.\nThis can cause distortion or loss of punch on smaller systems.”`,
    treble: `“High frequencies may sound harsh on loud playback.”`,
    dynamics: `“This mix has limited dynamics.\nLoudness may increase, but impact may not.”`,
    stereo: `“The stereo image is narrow.\nThis can make the mix feel crowded.”`,
    phase: `“Phase issues detected.\nBass impact may reduce in mono playback.”`,
    vocals: `“Vocals may not sit clearly in the mix.”`,
  };

  const health = {
    results: null,
    toneStage: "clean",
    fixes: { lowEnd:"ask", treble:"ask", dynamics:"ask", stereo:"ask", phase:"ask", vocals:"ask" }
  };

  function setProgress(p){ bar.style.width = `${Math.round(Math.max(0, Math.min(1, p))*100)}%`; }
  function setStatus(t){ statusLine.textContent = t; }
  function setReport(html, kind=""){
    reportBox.classList.remove("bad","good");
    if(kind) reportBox.classList.add(kind);
    reportBox.innerHTML = html;
  }
  function setStage(mode){
    stageLed.classList.remove("mix","master","bad");
    rackEdge.classList.remove("master");
    screen.classList.remove("masterMode");
    if(mode==="master"){ stageLed.classList.add("master"); rackEdge.classList.add("master"); screen.classList.add("masterMode"); }
    else if(mode==="bad"){ stageLed.classList.add("bad"); }
    else { stageLed.classList.add("mix"); }
  }

  function fmtSec(sec){ const m=Math.floor(sec/60); const s=Math.round(sec-m*60); return `${m}:${String(s).padStart(2,"0")}`; }
  function bytesToMB(b){ return (b/1024/1024).toFixed(1); }
  function dbToGain(db){ return Math.pow(10, db/20); }

  function guessInstrTag(filename){
    const n=(filename||"").toLowerCase();
    if(n.includes("piano")||n.includes("key")||n.includes("keyboard")||n.includes("keys")) return "keyboard";
    if(n.includes("pad")||n.includes("atmo")||n.includes("atmos")) return "pad";
    if(n.includes("guitar")) return "guitar";
    if(n.includes("synth")||n.includes("lead")||n.includes("pluck")) return "synth";
    return "other";
  }
  function warnIfLooksLikeFullMix(file){
    const n=(file.name||"").toLowerCase();
    if(n.includes("mix")||n.includes("master")||n.includes("fullsong")||n.includes("full_song")) return `This looks like a full mix/master (“${file.name}”). Please upload stems only.`;
    return null;
  }

  async function ensureDecodeCtx(){
    if(!decodeCtx) decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(decodeCtx.state === "suspended") await decodeCtx.resume();
  }

  function computeRMS(ch){ let s=0; for(let i=0;i<ch.length;i++){ const v=ch[i]; s+=v*v; } return Math.sqrt(s/ch.length); }
  function computePeak(ch){ let p=0; for(let i=0;i<ch.length;i++){ const a=Math.abs(ch[i]); if(a>p)p=a; } return p; }
  function analyzeBuffer(buf){
    const ch0=buf.getChannelData(0);
    const rms=computeRMS(ch0);
    const peak=computePeak(ch0);
    return { rms, peak, duration:buf.duration, channels:buf.numberOfChannels, sampleRate:buf.sampleRate };
  }

  function allLoaded(){
    return Object.values(buckets).every(b => b.files.length >= b.min && b.files.length <= b.max);
  }
  function allInstrTagged(){
    const b=buckets.instr;
    if(b.files.length===0) return false;
    return b.tags.length===b.files.length && b.tags.every(Boolean);
  }
  function clearBucket(key){
    buckets[key].files=[]; buckets[key].buffers=[]; buckets[key].tags=[];
  }
  function resetAll(){
    Object.keys(buckets).forEach(clearBucket);
    options.genre="trap"; options.resultType="mix_master"; options.loudness="safe"; options.rbVocal="blend"; options.trapBass="trunk";
    renderedOnce=false;
    health.results=null; health.toneStage="clean";
    Object.keys(health.fixes).forEach(k=>health.fixes[k]="ask");
    setProgress(0); setStage("mix"); setStatus("Idle.");
    setReport(`<strong>Report:</strong> Upload stems through the wizard to continue.`);
    go(SCREENS.WELCOME);
  }

  function validateAllStems(){
    if(!allLoaded()) return { ok:false, msg:"Missing required stem categories." };
    if(!allInstrTagged()) return { ok:false, msg:"Tag every instrument file (Keyboard/Synth/Pad/Guitar/Other) before continuing." };

    const durations=[];
    for(const b of Object.values(buckets)) for(const buf of b.buffers) durations.push(buf.duration);
    const minD=Math.min(...durations), maxD=Math.max(...durations);
    if(maxD-minD > DURATION_TOLERANCE_SEC) return { ok:false, msg:`All stems must be the same length. Detected ${fmtSec(minD)} to ${fmtSec(maxD)}.` };
    if(maxD > MAX_SECONDS+0.01) return { ok:false, msg:`A stem is longer than 5:00 (${fmtSec(maxD)}). Please trim and re-export.` };

    for(const b of Object.values(buckets)){
      for(let i=0;i<b.buffers.length;i++){
        const a=analyzeBuffer(b.buffers[i]);
        if(a.rms < SILENT_RMS) return { ok:false, msg:`“${b.files[i].name}” appears silent/near-silent. Re-export that stem.` };
        if(a.peak >= CLIP_PEAK) return { ok:false, msg:`“${b.files[i].name}” is heavily clipped. Re-export for best results.` };
      }
    }
    return { ok:true, msg:`Stems validated: ${fmtSec((minD+maxD)/2)} total length.` };
  }

  function wizardShell(title, subtitle, innerHtml){
    return `
      <div class="grid">
        <div class="row">
          <div style="display:grid; gap:6px">
            <div class="big">${title}</div>
            <div class="muted">${subtitle}</div>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
            <span class="pill"><strong>Mode</strong> AI Stems</span>
            <span class="pill"><strong>Baseline</strong> -6 dB Mix Bus Peak</span>
          </div>
        </div>
        ${innerHtml}
      </div>
    `;
  }

  function uploadSlotHtml(key, stepNum, stepTotal, allowMulti, examples){
    const b=buckets[key];
    const filesHtml = b.files.length ? `
      <div class="fileList">
        ${b.files.map((f, idx) => {
          const a = b.buffers[idx] ? analyzeBuffer(b.buffers[idx]) : null;
          const warn = warnIfLooksLikeFullMix(f);
          return `
            <div class="fileRow">
              <div class="fileMeta">
                <div class="name">${f.name}</div>
                <div class="submeta">${bytesToMB(f.size)} MB • ${a ? fmtSec(a.duration) : "…"} • ${a ? `${a.channels}ch` : ""}${warn ? ` • <span style="color:var(--bad)">looks like full mix</span>` : ""}</div>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
                <span class="pill good"><strong>READY</strong></span>
                <button class="btn danger" data-action="remove" data-key="${key}" data-idx="${idx}">Remove</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    ` : `<div class="notice"><strong>Insert Stem:</strong> ${examples}</div>`;

    return wizardShell(
      `Step ${stepNum} of ${stepTotal} — ${b.label}`,
      `Required. ${allowMulti ? `Upload ${b.min}–${b.max} files.` : `Upload ${b.min} file.`} Max ${MAX_MB_PER_FILE}MB each. ≤ 5:00. Same length.`,
      `
        <div class="slot">
          <div class="slotTop">
            <div class="slotName">
              <span class="led mix" style="width:9px;height:9px"></span>
              <div class="label">${b.label} Module</div>
            </div>
            <div class="slotHint">${allowMulti ? "Multi-file allowed" : "Single file required"}</div>
          </div>

          <div>
            <input type="file" id="fileInput_${key}" ${allowMulti ? "multiple" : ""} accept="audio/*" />
            <div class="muted" style="margin-top:6px">${examples}</div>
          </div>

          ${filesHtml}

          <div class="notice ${b.files.length>=b.min ? "good":"bad"}">
            <strong>Status:</strong> ${b.files.length>=b.min ? `Loaded (${b.files.length})` : `Missing — required`}
          </div>
        </div>
      `
    );
  }

  function instrumentsTagHtml(){
    const b=buckets.instr;
    const list = b.files.length ? b.files.map((f, idx) => {
      const current=b.tags[idx]||"";
      const setBtn=(value,label)=>`
        <span class="ledBtn ${current===value?"on":""}" data-action="tag" data-idx="${idx}" data-value="${value}">${label}</span>
      `;
      return `
        <div class="fileRow">
          <div class="fileMeta">
            <div class="name">${f.name}</div>
            <div class="submeta">${bytesToMB(f.size)} MB • ${b.buffers[idx]?fmtSec(b.buffers[idx].duration):"…"} • TYPE: <span class="mono">${current||"UNSET"}</span></div>
          </div>
          <div class="ledBtns">
            ${setBtn("keyboard","Keyboard")}
            ${setBtn("synth","Synth")}
            ${setBtn("pad","Pad")}
            ${setBtn("guitar","Guitar")}
            ${setBtn("other","Other")}
          </div>
        </div>
      `;
    }).join("") : "";

    const missingTag = b.files.length && !allInstrTagged();

    return wizardShell(
      "Step 4 of 5 — Instruments",
      "Upload 1–6 instrument stems. Then tag EACH file so the system applies the right settings.",
      `
        <div class="slot">
          <div class="slotTop">
            <div class="slotName">
              <span class="led mix" style="width:9px;height:9px"></span>
              <div class="label">Instruments Module</div>
            </div>
            <div class="slotHint">Tag per file (LED buttons)</div>
          </div>

          <div>
            <input type="file" id="fileInput_instr" multiple accept="audio/*" />
            <div class="muted" style="margin-top:6px">Examples: Synth.wav • Keyboard.wav • Guitar.wav • Pad.wav</div>
          </div>

          ${b.files.length ? `
            <div class="notice"><strong>Tagging:</strong> Select one type for each file.</div>
            <div class="fileList">${list}</div>
            <div class="notice ${missingTag?"bad":"good"}"><strong>Status:</strong> ${missingTag ? "Missing tags — select a type for every file." : "All instrument files tagged."}</div>
          ` : `<div class="notice"><strong>Insert Stem:</strong> Upload your synths/keys/guitars/pads here.</div>`}
        </div>
      `
    );
  }

  function reviewHtml(){
    const v=validateAllStems();
    const lines=[];
    const bucketLine=(key)=>{ const b=buckets[key]; const c=b.files.length; return `✔ ${b.label}: ${c} file${c===1?"":"s"}`; };
    lines.push(bucketLine("vocals"), bucketLine("drums"), bucketLine("bass"), bucketLine("instr"), bucketLine("other"));

    const dur=(()=>{ const all=Object.values(buckets).flatMap(b=>b.buffers.map(x=>x.duration)); if(!all.length) return "—"; return fmtSec((Math.min(...all)+Math.max(...all))/2); })();

    return wizardShell(
      "Review Your Stems",
      "All categories must be present. Lengths must match. Bad stems are blocked.",
      `
        <div class="slot">
          <div class="row">
            <div style="display:grid; gap:6px"><div class="big">Loaded</div><div class="muted mono">${lines.join("\n")}</div></div>
            <div style="display:grid; gap:6px; text-align:right"><div class="big">Track Length</div><div class="muted mono">${dur}</div></div>
          </div>

          <div class="notice ${v.ok?"good":"bad"}"><strong>${v.ok?"PASS":"BLOCKED"}:</strong> ${v.msg}</div>
          <div class="notice"><strong>Reminder:</strong> Do NOT upload the full mixed song. Stems only.</div>
        </div>
      `
    );

  async function handleFilesForBucket(key, fileList){
    const b=buckets[key];
    const files=Array.from(fileList||[]);
    if(!files.length) return;

    if(files.length + b.files.length > b.max) throw new Error(`${b.label}: You can upload up to ${b.max} file(s) here.`);

    await ensureDecodeCtx();
    for(const f of files){
      if(f.size > MAX_BYTES_PER_FILE) throw new Error(`"${f.name}" is ${bytesToMB(f.size)}MB. Max is ${MAX_MB_PER_FILE}MB.`);
      if(!f.type || !f.type.toLowerCase().startsWith("audio/")) throw new Error(`"${f.name}" isn't recognized as audio.`);
      const mixWarn=warnIfLooksLikeFullMix(f);
      if(mixWarn) throw new Error(mixWarn);
    }

    for(const f of files){
      setStatus(`Decoding: ${b.label} — ${f.name}`);
      setProgress(0.08);

      let ab;
      try{ ab = await f.arrayBuffer(); }catch(_){ throw new Error(`Couldn't read "${f.name}". Try WAV or MP3.`); }

      let buf;
      try{ buf = await decodeCtx.decodeAudioData(ab.slice(0)); }
      catch(_){ throw new Error(`Couldn't open "${f.name}". Convert to WAV or MP3 and try again.`); }

      if(buf.duration > MAX_SECONDS + 0.01) throw new Error(`"${f.name}" is longer than 5:00 (${fmtSec(buf.duration)}). Trim and re-export.`);

      const a=analyzeBuffer(buf);
      if(a.rms < SILENT_RMS) throw new Error(`"${f.name}" appears silent/near-silent. Re-export that stem.`);
      if(a.peak >= CLIP_PEAK) throw new Error(`"${f.name}" is clipped. Re-export that stem.`);

      b.files.push(f);
      b.buffers.push(buf);
      if(key==="instr") b.tags.push(guessInstrTag(f.name));
    }

    // invalidate scan
    health.results=null;
    Object.keys(health.fixes).forEach(k=>health.fixes[k]="ask");

    setStatus("Decoded.");
    setProgress(0);
    go(step);
  }

    go(step);

  // ===== DSP/Render =====
  function softClipSample(x, drive=1.1){ return Math.tanh(x*drive); }

  function makeBiquadEQ(ctx,type,freq,q,gainDb){
    const f=ctx.createBiquadFilter();
    f.type=type; f.frequency.value=freq;
    if(q!=null) f.Q.value=q;
    if(gainDb!=null && f.gain) f.gain.value=gainDb;
    return f;
  }
  function makeComp(ctx,thr,ratio,atk,rel,knee=6){
    const c=ctx.createDynamicsCompressor();
    c.threshold.value=thr; c.ratio.value=ratio; c.attack.value=atk; c.release.value=rel; c.knee.value=knee;
    return c;
  }

  function getGenreParams(){
    const base={ widthMax:0.82, vocalForwardDb:0.0, fizzDb:-1.5, harshDb:-1.0, boxDb:-1.2, bassMudDb:-1.5, bassRelease:0.16 };
    const g=options.genre;
    const p={...base};

    if(g==="trap"){
      p.widthMax=0.76; p.fizzDb=-2.2; p.harshDb=-1.2; p.boxDb=-1.2; p.bassMudDb=-1.8; p.vocalForwardDb=0.3;
      if(options.trapBass==="trunk"){ p.bassRelease=0.20; p.bassMudDb=-1.4; }
      else { p.bassRelease=0.14; p.bassMudDb=-2.0; }
    } else if(g==="rap"){
      p.widthMax=0.80; p.fizzDb=-1.8; p.harshDb=-1.0; p.boxDb=-1.0; p.bassMudDb=-1.6; p.vocalForwardDb=0.4;
    } else if(g==="rb"){
      p.widthMax=0.86; p.fizzDb=-1.4; p.harshDb=-0.8; p.boxDb=-1.0; p.bassMudDb=-1.4; p.vocalForwardDb=0.2;
      if(options.rbVocal==="blend"){ p.vocalForwardDb=-0.1; p.harshDb=-0.6; }
      else { p.vocalForwardDb=0.6; p.harshDb=-0.9; }
    } else if(g==="pop"){
      p.widthMax=0.86; p.fizzDb=-1.6; p.harshDb=-0.9; p.boxDb=-1.0; p.bassMudDb=-1.5; p.vocalForwardDb=0.3;
    } else if(g==="rock"){
      p.widthMax=0.92; p.fizzDb=-1.2; p.harshDb=-0.8; p.boxDb=-0.9; p.bassMudDb=-1.2; p.vocalForwardDb=0.1;
    } else if(g==="edm"){
      p.widthMax=0.95; p.fizzDb=-1.6; p.harshDb=-0.9; p.boxDb=-1.1; p.bassMudDb=-1.8; p.vocalForwardDb=0.0;
    }
    return p;
  }

  function mergeBuffersList(){
    const list=[];
    buckets.vocals.buffers.forEach((buf,i)=>list.push({role:"vocals",buffer:buf,name:buckets.vocals.files[i].name}));
    buckets.drums.buffers.forEach((buf,i)=>list.push({role:"drums",buffer:buf,name:buckets.drums.files[i].name}));
    buckets.bass.buffers.forEach((buf,i)=>list.push({role:"bass",buffer:buf,name:buckets.bass.files[i].name}));
    buckets.instr.buffers.forEach((buf,i)=>list.push({role:"instr",buffer:buf,name:buckets.instr.files[i].name,instrTag:buckets.instr.tags[i]}));
    buckets.other.buffers.forEach((buf,i)=>list.push({role:"other",buffer:buf,name:buckets.other.files[i].name}));
    return list;
  }

  // stereo-aware, windowed scan (start/mid/end)
  function calcMixedPeak(list){
    const dur=list[0].buffer.duration;
    const sr=list[0].buffer.sampleRate;
    const totalFrames=Math.floor(dur*sr);

    const windowSec=Math.min(20,dur);
    const windowFrames=Math.floor(windowSec*sr);
    const positions=[
      0,
      Math.max(0, Math.floor(totalFrames/2 - windowFrames/2)),
      Math.max(0, totalFrames - windowFrames)
    ];
    const stride=Math.max(1, Math.floor(windowFrames/80000)); // ~80k points per window

    let peak=0;

    for(const start of positions){
      const end=Math.min(totalFrames, start+windowFrames);
      for(let i=start;i<end;i+=stride){
        let sumL=0, sumR=0;
        for(const item of list){
          const b=item.buffer;
          const L=b.getChannelData(0);
          const idx=Math.min(i, L.length-1);
          sumL += L[idx];
          if(b.numberOfChannels>1){
            const R=b.getChannelData(1);
            sumR += R[Math.min(i, R.length-1)];
          } else {
            sumR += L[idx];
          }
        }
        const a=Math.max(Math.abs(sumL), Math.abs(sumR));
        if(a>peak) peak=a;
      }
    }
    return peak;
  }

  function analyzeRendered(buf){
    const ch0=buf.getChannelData(0);
    const rms=computeRMS(ch0);
    const peak=computePeak(ch0);
    const crest=peak/(rms||1e-9);
    return { rms, peak, crest };
  }

  function shouldAllowLoudMode(post){
    if(!post) return false;
    if(post.crest < 1.6) return false;
    if(post.peak >= 0.999) return false;
    return true;
  }

  function setRenderMsg(t){ const el=document.getElementById("renderMsg"); if(el) el.textContent=t; }
  function setRenderProgress(p){ const el=document.getElementById("renderBar"); if(el) el.style.width=`${Math.round(Math.max(0,Math.min(1,p))*100)}%`; }

  async function runMixHealthScan(){
    setStatus("Running Mix Health Scan…");
    setProgress(0.12);
    setReport(`<strong>Report:</strong> Running Mix Health Scan…`);

    const list=mergeBuffersList();
    const dur=list[0].buffer.duration;
    const sliceSec=Math.min(20,dur);
    const frames=Math.floor(sliceSec*SR);

    const oac=new OfflineAudioContext(2, frames, SR);
    const mix=oac.createGain(); mix.gain.value=1.0; mix.connect(oac.destination);

    for(const item of list){
      const src=oac.createBufferSource(); src.buffer=item.buffer;
      const g=oac.createGain(); g.gain.value=1.0;
      src.connect(g); g.connect(mix);
      src.start(0);
    }

    const preview=await oac.startRendering();
    setProgress(0.35);

    async function bandEnergy(type,freq,q=0.7){
      const o=new OfflineAudioContext(1, frames, SR);
      const s=o.createBufferSource(); s.buffer=preview;

      const split=o.createChannelSplitter(2);
      const l=o.createGain(); l.gain.value=0.5;
      const r=o.createGain(); r.gain.value=0.5;
      const sum=o.createGain(); sum.gain.value=1.0;

      const f=o.createBiquadFilter();
      f.type=type; f.frequency.value=freq; f.Q.value=q;

      s.connect(split);
      split.connect(l,0); split.connect(r,1);
      l.connect(sum); r.connect(sum);
      sum.connect(f); f.connect(o.destination);

      s.start(0);
      const out=await o.startRendering();
      const ch=out.getChannelData(0);
      let e=0;
      for(let i=0;i<ch.length;i++){ const v=ch[i]; e+=v*v; }
      return e/ch.length;
    }

    function midSideRatio(buf){
      const L=buf.getChannelData(0), R=buf.getChannelData(1);
      let midE=0, sideE=0;
      for(let i=0;i<L.length;i++){
        const m=(L[i]+R[i])*0.5;
        const s=(L[i]-R[i])*0.5;
        midE += m*m; sideE += s*s;
      }
      midE/=L.length; sideE/=L.length;
      return sideE/(midE+1e-9);
    }
    function corr(buf){
      const L=buf.getChannelData(0), R=buf.getChannelData(1);
      let sumLR=0,sumL2=0,sumR2=0;
      for(let i=0;i<L.length;i++){ const l=L[i], r=R[i]; sumLR+=l*r; sumL2+=l*l; sumR2+=r*r; }
      return sumLR/(Math.sqrt(sumL2*sumR2)+1e-9);
    }

    const dyn=analyzeRendered(preview);
    const subE=await bandEnergy("lowpass",90,0.7); setProgress(0.52);
    const lowMid=await bandEnergy("peaking",250,1.0); setProgress(0.62);
    const harshE=await bandEnergy("peaking",3800,1.2); setProgress(0.72);
    const airE=await bandEnergy("highpass",9000,0.7); setProgress(0.82);

    const sideRatio=midSideRatio(preview);
    const c=corr(preview);

    const flags={
      lowEnd: (subE > airE*6.0) || (lowMid > airE*4.0),
      treble: (airE > subE*1.35) || (harshE > subE*1.05),
      dynamics: (dyn.crest < 1.75),
      stereo: (sideRatio < 0.10),
      phase: (c < 0.15),
      vocals: false
    };

    let toneStage="clean";
    let toneStageNote="Clean / Transparent Stage — mix looks stable. No color. Just control + polish.";
    const thin=(lowMid < airE*0.85);
    if(thin && !flags.treble){ toneStage="warm"; toneStageNote="Warm / Tube-Style Stage — mix feels thin/sterile. Adds subtle density (conditional)."; }
    if(flags.dynamics && !flags.lowEnd){ toneStage="punch"; toneStageNote="Punch / Console-Style Stage — dynamics are flat. Restores impact without flattening."; }

    health.results={ flags, toneStageNote };
    health.toneStage=toneStage;

    setProgress(1);
    setStatus("Mix Health Scan complete.");
    setReport(`<strong>Report:</strong> Mix Health Scan complete. Choose which fixes to apply (optional).`, "good");
  }

  async function preflightLoudMode(list){
    const dur=list[0].buffer.duration;
    const sliceSec=Math.min(18,dur);
    const frames=Math.floor(sliceSec*SR);

    const mixedPeak=calcMixedPeak(list);
    const targetPeak=dbToGain(-6.0);
    const globalTrim=mixedPeak>1e-9 ? (targetPeak/mixedPeak) : 1.0;

    const gp=getGenreParams();

    const oac=new OfflineAudioContext(2, frames, SR);
    const bus=oac.createGain(); bus.gain.value=1.0;

    for(const item of list){
      const src=oac.createBufferSource(); src.buffer=item.buffer;
      const g=oac.createGain(); g.gain.value=globalTrim;
      src.connect(g); g.connect(bus);
      src.start(0);
    }

    const mBox=makeBiquadEQ(oac,"peaking",320,1.0,Math.min(-0.7,gp.boxDb/1.2));
    const mHarsh=makeBiquadEQ(oac,"peaking",3800,1.2,gp.harshDb);
    const mFizz=makeBiquadEQ(oac,"highshelf",10500,0.7,gp.fizzDb);

    const shaper=oac.createWaveShaper();
    const curveLen=65536;
    const curve=new Float32Array(curveLen);
    const drive=1.18;
    for(let i=0;i<curveLen;i++){ const x=(i/(curveLen-1))*2-1; curve[i]=softClipSample(x,drive); }
    shaper.curve=curve; shaper.oversample="4x";

    const limiter=makeComp(oac,-2.2,20.0,0.003,0.090,0);
    const ceiling=oac.createGain(); ceiling.gain.value=dbToGain(-1.0);

    bus.connect(mBox);
    mBox.connect(mHarsh); mHarsh.connect(mFizz);
    mFizz.connect(shaper); shaper.connect(limiter); limiter.connect(ceiling); ceiling.connect(oac.destination);

    const rendered=await oac.startRendering();
    const a=analyzeRendered(rendered);
    return shouldAllowLoudMode({ peak:a.peak, crest:a.crest });
  }

  async function renderFinal(){
    go(SCREENS.RENDERING);
    setStage("master");
    setStatus("Rendering…");
    setProgress(0.10);
    setRenderProgress(0.02);
    setReport(`<strong>Report:</strong> Rendering final master… (one render only)`, "good");

    const v=validateAllStems();
    if(!v.ok){
      setReport(`<strong>Blocked:</strong> ${v.msg}`, "bad");
      return go(SCREENS.REVIEW);
    }

    const list=mergeBuffersList();

    // Preflight loud BEFORE render
    if(options.loudness==="loud"){
      setRenderMsg("Preflight: checking Loud Mode safety…");
      setRenderProgress(0.05);
      const ok=await preflightLoudMode(list);
      if(!ok){
        options.loudness="safe";
        setReport(`<strong>Report:</strong> Loud mode was not safe for this track. Safe mode applied.`, "good");
      }
    }

    const duration=list[0].buffer.duration;
    const frames=Math.ceil(duration*SR);

    setRenderMsg("Calibrating gain structure (-6 dB baseline) …");
    setRenderProgress(0.08);

    const mixedPeak=calcMixedPeak(list);
    const targetPeak=dbToGain(-6.0);
    const globalTrim=mixedPeak>1e-9 ? (targetPeak/mixedPeak) : 1.0;

    const oac=new OfflineAudioContext(2, frames, SR);

    // buses
    const busVoc=oac.createGain();
    const busDrm=oac.createGain();
    const busBas=oac.createGain();
    const busIns=oac.createGain();
    const busOth=oac.createGain();
    const mixBus=oac.createGain();

    busVoc.connect(mixBus);
    busDrm.connect(mixBus);
    busBas.connect(mixBus);
    busIns.connect(mixBus);
    busOth.connect(mixBus);

    const gp=getGenreParams();
    const applyFix=(k)=>!!health.results?.flags?.[k] && health.fixes[k]==="apply";

    // per-role chains
    const vHP=makeBiquadEQ(oac,"highpass",80,0.7,null);
    const vBox=makeBiquadEQ(oac,"peaking",300,1.1,-1.5);
    const vHarsh=makeBiquadEQ(oac,"peaking",3800,1.2,applyFix("treble")?Math.min(-1.2,gp.harshDb*1.1):gp.harshDb);
    const vFizz=makeBiquadEQ(oac,"highshelf",10500,0.7,applyFix("treble")?Math.min(-2.2,gp.fizzDb*1.2):gp.fizzDb);
    const vComp=makeComp(oac,-18,2.5,0.020,0.110,6);
    const vGain=oac.createGain(); vGain.gain.value=dbToGain(gp.vocalForwardDb + (applyFix("vocals")?0.3:0));
    vHP.connect(vBox); vBox.connect(vHarsh); vHarsh.connect(vFizz); vFizz.connect(vComp); vComp.connect(vGain); vGain.connect(busVoc);

    const dHP=makeBiquadEQ(oac,"highpass",25,0.7,null);
    const dMud=makeBiquadEQ(oac,"peaking",240,1.0,-1.0);
    const dFizz=makeBiquadEQ(oac,"highshelf",11000,0.7,Math.min(-0.8,gp.fizzDb/2));
    const dComp=makeComp(oac,-16,3.0,0.015,0.090,6);
    dHP.connect(dMud); dMud.connect(dFizz); dFizz.connect(dComp); dComp.connect(busDrm);

    const bLP=makeBiquadEQ(oac,"lowpass",9000,0.7,null);
    const bMud=makeBiquadEQ(oac,"peaking",240,1.0,applyFix("lowEnd")?Math.min(gp.bassMudDb,-2.2):gp.bassMudDb);
    const bComp=makeComp(oac,-20,3.0,0.030,gp.bassRelease,6);
    bLP.connect(bMud); bMud.connect(bComp); bComp.connect(busBas);

    const iHP=makeBiquadEQ(oac,"highpass",110,0.7,null);
    const iBox=makeBiquadEQ(oac,"peaking",320,1.0,gp.boxDb);
    const iHarsh=makeBiquadEQ(oac,"peaking",3600,1.1,Math.min(-0.4,gp.harshDb/1.3));
    const iComp=makeComp(oac,-22,2.0,0.020,0.120,6);
    iHP.connect(iBox); iBox.connect(iHarsh); iHarsh.connect(iComp); iComp.connect(busIns);

    const oHP=makeBiquadEQ(oac,"highpass",120,0.7,null);
    const oFizz=makeBiquadEQ(oac,"highshelf",10500,0.7,Math.min(-1.0,gp.fizzDb/1.2));
    const oGain=oac.createGain(); oGain.gain.value=dbToGain(-1.0);
    oHP.connect(oFizz); oFizz.connect(oGain); oGain.connect(busOth);

    if(applyFix("vocals")) busIns.gain.value=dbToGain(-0.3);

    // sources
    setRenderMsg("Balancing stems (Mix stage) …");
    setRenderProgress(0.18);

    for(const item of list){
      const src=oac.createBufferSource(); src.buffer=item.buffer;
      const g=oac.createGain(); g.gain.value=globalTrim;

      if(item.role==="instr"){
        const tagIn=oac.createGain();
        const tagOut=oac.createGain();
        const tagNodes=[];
        const tag=item.instrTag||"other";
        if(tag==="keyboard"){
          tagNodes.push(makeBiquadEQ(oac,"highpass",110,0.7,null));
          tagNodes.push(makeBiquadEQ(oac,"peaking",300,1.0,-1.2));
        } else if(tag==="synth"){
          tagNodes.push(makeBiquadEQ(oac,"highpass",100,0.7,null));
          tagNodes.push(makeBiquadEQ(oac,"peaking",3800,1.2,Math.min(-0.6,gp.harshDb)));
          tagNodes.push(makeBiquadEQ(oac,"highshelf",11000,0.7,applyFix("treble")?Math.min(gp.fizzDb,-2.6):Math.min(-1.2,gp.fizzDb)));
        } else if(tag==="pad"){
          tagNodes.push(makeBiquadEQ(oac,"highpass",140,0.7,null));
          tagNodes.push(makeBiquadEQ(oac,"peaking",320,1.0,-1.4));
          tagNodes.push(makeBiquadEQ(oac,"peaking",3000,1.0,-0.6));
        } else if(tag==="guitar"){
          tagNodes.push(makeBiquadEQ(oac,"highpass",95,0.7,null));
          tagNodes.push(makeBiquadEQ(oac,"peaking",260,1.0,-1.2));
          tagNodes.push(makeBiquadEQ(oac,"peaking",3800,1.0,-0.7));
        } else {
          tagNodes.push(makeBiquadEQ(oac,"highpass",110,0.7,null));
          tagNodes.push(makeBiquadEQ(oac,"peaking",320,1.0,-0.9));
        }
        let prev=tagIn;
        for(const n of tagNodes){ prev.connect(n); prev=n; }
        prev.connect(tagOut);

        src.connect(g);
        g.connect(tagIn);
        tagOut.connect(iHP);
      } else if(item.role==="vocals"){
        src.connect(g); g.connect(vHP);
      } else if(item.role==="drums"){
        src.connect(g); g.connect(dHP);
      } else if(item.role==="bass"){
        src.connect(g); g.connect(bLP);
      } else if(item.role==="other"){
        src.connect(g); g.connect(oHP);
      }
      src.start(0);
    }

    // mix glue
    setRenderMsg("Applying mix bus glue …");
    setRenderProgress(0.34);

    const glueRatio=applyFix("dynamics")?1.6:2.0;
    const mixGlue=makeComp(oac,-18,glueRatio,0.030,0.120,6);
    const mixBox=makeBiquadEQ(oac,"peaking",320,1.0,applyFix("lowEnd")?-1.0:Math.min(-0.6,gp.boxDb/1.4));
    const mixHarsh=makeBiquadEQ(oac,"peaking",3600,1.1,applyFix("treble")?Math.min(-1.0,gp.harshDb):Math.min(-0.5,gp.harshDb/1.4));
    const mixFizz=makeBiquadEQ(oac,"highshelf",11000,0.7,applyFix("treble")?Math.min(-1.6,gp.fizzDb):Math.min(-0.8,gp.fizzDb/1.6));

    mixBus.connect(mixGlue);
    mixGlue.connect(mixBox);
    mixBox.connect(mixHarsh);
    mixHarsh.connect(mixFizz);

    // master stability + width
    setRenderMsg("Restoring dynamics + stereo stability …");
    setRenderProgress(0.52);

    const lowLP_L=makeBiquadEQ(oac,"lowpass",120,0.7,null);
    const lowLP_R=makeBiquadEQ(oac,"lowpass",120,0.7,null);
    const highHP_L=makeBiquadEQ(oac,"highpass",120,0.7,null);
    const highHP_R=makeBiquadEQ(oac,"highpass",120,0.7,null);

    const split=oac.createChannelSplitter(2);
    const merge=oac.createChannelMerger(2);

    const midGain=oac.createGain(); midGain.gain.value=1.0;

    let width=gp.widthMax;
    if(applyFix("stereo")) width=Math.min(0.95, width*1.10);
    if(health.results?.flags?.phase) width=Math.min(width, applyFix("phase")?0.70:0.75);
    const sideGain=oac.createGain(); sideGain.gain.value=width;

    const lToMid=oac.createGain(); lToMid.gain.value=0.5;
    const rToMid=oac.createGain(); rToMid.gain.value=0.5;
    const lToSide=oac.createGain(); lToSide.gain.value=0.5;
    const rToSide=oac.createGain(); rToSide.gain.value=-0.5;
    const midToL=oac.createGain(); midToL.gain.value=1.0;
    const sideToL=oac.createGain(); sideToL.gain.value=1.0;
    const midToR=oac.createGain(); midToR.gain.value=1.0;
    const sideToR=oac.createGain(); sideToR.gain.value=-1.0;

    const mBox=makeBiquadEQ(oac,"peaking",320,1.0,applyFix("lowEnd")?-1.2:Math.min(-0.7,gp.boxDb/1.2));
    const mHarsh=makeBiquadEQ(oac,"peaking",3800,1.2,applyFix("treble")?Math.min(-1.4,gp.harshDb*1.15):gp.harshDb);
    const mFizz=makeBiquadEQ(oac,"highshelf",10500,0.7,applyFix("treble")?Math.min(-2.4,gp.fizzDb*1.2):gp.fizzDb);

    const masterRatio=applyFix("dynamics")?1.4:1.7;
    const mComp=makeComp(oac,-16,masterRatio,0.030,0.130,6);

    mixFizz.connect(mBox);
    mBox.connect(mHarsh);
    mHarsh.connect(mFizz);
    mFizz.connect(mComp);
    mComp.connect(split);

    split.connect(lowLP_L,0);
    split.connect(lowLP_R,1);

    const lowMonoSum=oac.createGain(); lowMonoSum.gain.value=0.5;
    const lowMonoSumR=oac.createGain(); lowMonoSumR.gain.value=0.5;
    lowLP_L.connect(lowMonoSum);
    lowLP_R.connect(lowMonoSumR);

    const lowMono=oac.createGain(); lowMono.gain.value=1.0;
    lowMonoSum.connect(lowMono);
    lowMonoSumR.connect(lowMono);

    lowMono.connect(merge,0,0);
    lowMono.connect(merge,0,1);

    split.connect(highHP_L,0);
    split.connect(highHP_R,1);

    highHP_L.connect(lToMid); highHP_R.connect(rToMid);
    lToMid.connect(midGain);  rToMid.connect(midGain);

    highHP_L.connect(lToSide); highHP_R.connect(rToSide);
    lToSide.connect(sideGain); rToSide.connect(sideGain);

    midGain.connect(midToL); sideGain.connect(sideToL);
    midToL.connect(merge,0,0); sideToL.connect(merge,0,0);

    midGain.connect(midToR); sideGain.connect(sideToR);
    midToR.connect(merge,0,1); sideToR.connect(merge,0,1);

    // soft clip + limiter + ceiling
    setRenderMsg("Engaging soft clip + safety limiter …");
    setRenderProgress(0.72);

    let drive=(options.loudness==="loud")?1.18:1.10;
    if(health.toneStage==="warm" && !health.results?.flags?.treble) drive+=0.03;
    if(health.toneStage==="punch") drive+=0.01;
    if(applyFix("dynamics")) drive=Math.min(drive,1.12);

    const shaper=oac.createWaveShaper();
    const curveLen=65536;
    const curve=new Float32Array(curveLen);
    for(let i=0;i<curveLen;i++){ const x=(i/(curveLen-1))*2-1; curve[i]=softClipSample(x,drive); }
    shaper.curve=curve; shaper.oversample="4x";

    const limiter=makeComp(oac,-2.2,20.0,0.003,0.090,0);
    const ceiling=oac.createGain(); ceiling.gain.value=dbToGain(options.loudness==="loud"?-1.0:-1.5);

    merge.connect(shaper);
    shaper.connect(limiter);
    limiter.connect(ceiling);
    ceiling.connect(oac.destination);

    setRenderMsg("Printing final master …");
    setRenderProgress(0.86);

    const rendered=await oac.startRendering();

    const a=analyzeRendered(rendered);
    if(options.loudness==="loud" && !shouldAllowLoudMode({peak:a.peak, crest:a.crest})){
      rendered.__gcSafeGain=dbToGain(-0.8);
      setReport(`<strong>Report:</strong> Final QC clipped Loud mode. Safe gain applied on export.`, "good");
    } else {
      setReport(`<strong>Report:</strong> Render complete. Output: 24-bit WAV.`, "good");
    }

    setRenderMsg("Finalizing file …");
    setRenderProgress(0.96);

    const wavBlob=encodeWav24(rendered, rendered.__gcSafeGain||1.0);
    const url=URL.createObjectURL(wavBlob);

    renderedOnce=true;
    go(SCREENS.DONE);
    document.getElementById("downloadLink").href=url;

    setRenderMsg("Done.");
    setRenderProgress(1);
    setStatus("Master ready.");
    setProgress(1);
  }

  function encodeWav24(audioBuffer, extraGain=1.0){
    const numCh=audioBuffer.numberOfChannels;
    const sampleRate=audioBuffer.sampleRate;
    const length=audioBuffer.length;
    const bytesPerSample=3;
    const blockAlign=numCh*bytesPerSample;
    const byteRate=sampleRate*blockAlign;
    const dataSize=length*blockAlign;

    const buffer=new ArrayBuffer(44+dataSize);
    const view=new DataView(buffer);

    let offset=0;
    const writeStr=(s)=>{ for(let i=0;i<s.length;i++) view.setUint8(offset+i, s.charCodeAt(i)); offset+=s.length; };
    const writeU32=(v)=>{ view.setUint32(offset, v, true); offset+=4; };
    const writeU16=(v)=>{ view.setUint16(offset, v, true); offset+=2; };

    writeStr("RIFF"); writeU32(36+dataSize); writeStr("WAVE");
    writeStr("fmt "); writeU32(16); writeU16(1); writeU16(numCh); writeU32(sampleRate); writeU32(byteRate); writeU16(blockAlign); writeU16(24);
    writeStr("data"); writeU32(dataSize);

    const chans=[];
    for(let c=0;c<numCh;c++) chans.push(audioBuffer.getChannelData(c));

    for(let i=0;i<length;i++){
      for(let c=0;c<numCh;c++){
        let s=chans[c][i]*extraGain;
        s=Math.max(-1, Math.min(1, s));
        const v=(s<0) ? Math.round(s*0x800000) : Math.round(s*0x7FFFFF);
        view.setUint8(offset++, (v     )&0xFF);
        view.setUint8(offset++, (v>>  8)&0xFF);
        view.setUint8(offset++, (v>> 16)&0xFF);
      }
    }
    return new Blob([buffer], {type:"audio/wav"});
  }

  // init
  backBtn.textContent="Back";
  nextBtn.textContent="Next";
  go(SCREENS.WELCOME);
  window.gcStudioReset=resetAll;
})();
</script>
