<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>G.C Studio Mix&Master — Gc v1/01</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#07070a;
      --panel:#0c0d12;
      --panel2:#0a0b10;
      --line:#1e2233;
      --text:#eaf0ff;
      --muted:#a8b3d6;

      --mix:#3a82ff;     /* blue */
      --master:#ffb25a;  /* amber */
      --bad:#ff6b6b;
      --good:#52ffa8;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 600px at 50% 0%, rgba(58,130,255,.10), transparent 55%),
                  radial-gradient(1200px 700px at 50% 120%, rgba(255,178,90,.06), transparent 60%),
                  var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    /* Smoky overlay */
    .smoke{
      pointer-events:none;
      position:fixed; inset:-20%;
      background:
        radial-gradient(700px 400px at 30% 40%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(900px 500px at 70% 60%, rgba(255,255,255,.05), transparent 62%),
        radial-gradient(800px 500px at 50% 80%, rgba(255,255,255,.04), transparent 65%);
      filter: blur(18px);
      opacity:.35;
      animation: drift 18s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes drift{
      0%{transform:translate3d(-2%, -1%, 0) rotate(0deg)}
      50%{transform:translate3d(2%, 1%, 0) rotate(1deg)}
      100%{transform:translate3d(-2%, -1%, 0) rotate(0deg)}
    }

    header{
      position:sticky; top:0; z-index:20;
      background: linear-gradient(180deg, rgba(7,7,10,.98), rgba(7,7,10,.82));
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
      padding:14px 14px 10px;
    }
    .brand{
      display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
      max-width:980px; margin:0 auto;
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    h1{margin:0; font-size:15px; letter-spacing:.3px}
    .sub{font-size:12px; color:var(--muted)}
    .stepbar{
      display:flex; align-items:center; gap:10px;
      font-size:12px; color:var(--muted);
    }
    .led{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,.12);
      box-shadow: 0 0 0 1px rgba(255,255,255,.10) inset;
    }
    .led.mix{background: rgba(58,130,255,.65); box-shadow: 0 0 12px rgba(58,130,255,.35), 0 0 0 1px rgba(58,130,255,.35) inset;}
    .led.master{background: rgba(255,178,90,.70); box-shadow: 0 0 14px rgba(255,178,90,.35), 0 0 0 1px rgba(255,178,90,.35) inset;}
    .led.bad{background: rgba(255,107,107,.75); box-shadow: 0 0 14px rgba(255,107,107,.35), 0 0 0 1px rgba(255,107,107,.35) inset;}

    main{max-width:980px; margin:0 auto; padding:14px; display:grid; gap:12px}
    .card{
      background: linear-gradient(180deg, rgba(12,13,18,.92), rgba(10,11,16,.88));
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 30%);
      pointer-events:none;
    }
    .rackEdge{
      position:absolute; left:0; right:0; bottom:0; height:2px;
      background: linear-gradient(90deg, transparent, rgba(58,130,255,.40), transparent);
      opacity:.65;
      pointer-events:none;
    }
    .rackEdge.master{
      background: linear-gradient(90deg, transparent, rgba(255,178,90,.45), transparent);
    }

    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between}
    .grid{display:grid; gap:10px}
    .muted{color:var(--muted); font-size:12px}
    .big{font-size:14px; font-weight:650; letter-spacing:.2px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .btn{
      border:1px solid #2c3350;
      background: #070812;
      color: var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      transition: transform .05s ease, border-color .2s ease;
      user-select:none;
    }
    .btn:hover{border-color:#3b4676}
    .btn:active{transform: translateY(1px)}
    .btn.primary{
      border-color: rgba(58,130,255,.55);
      box-shadow: 0 0 0 1px rgba(58,130,255,.20) inset, 0 0 18px rgba(58,130,255,.12);
    }
    .btn.primary.master{
      border-color: rgba(255,178,90,.60);
      box-shadow: 0 0 0 1px rgba(255,178,90,.22) inset, 0 0 18px rgba(255,178,90,.12);
    }
    .btn:disabled{opacity:.5; cursor:not-allowed}
    .btn.danger{
      border-color: rgba(255,107,107,.55);
      box-shadow: 0 0 0 1px rgba(255,107,107,.18) inset;
    }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid #2c3350; font-size:12px; color:var(--muted);
      background: rgba(0,0,0,.10);
    }
    .pill strong{color:var(--text); font-weight:650}
    .pill.good{border-color: rgba(82,255,168,.35); color:#bfffdc}
    .pill.bad{border-color: rgba(255,107,107,.35); color:#ffd1d1}

    .meter{
      height:10px; background:#070812; border:1px solid #2c3350; border-radius:999px; overflow:hidden;
    }
    .meter > div{height:100%; width:0%; background: linear-gradient(90deg, rgba(58,130,255,.9), rgba(255,178,90,.75));}

    .slot{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background: rgba(0,0,0,.10);
      display:grid; gap:10px;
    }
    .slotTop{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .slotName{display:flex; align-items:center; gap:10px}
    .slotName .label{font-weight:700; letter-spacing:.2px}
    .slotHint{font-size:12px; color:var(--muted)}

    .fileList{display:grid; gap:8px}
    .fileRow{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      padding:10px; border-radius:12px;
      border:1px solid #232a44;
      background: rgba(7,8,18,.75);
    }
    .fileMeta{display:grid; gap:2px}
    .fileMeta .name{font-size:12px; font-weight:650}
    .fileMeta .submeta{font-size:11px; color:var(--muted)}

    /* LED push buttons */
    .ledBtns{display:flex; gap:8px; flex-wrap:wrap}
    .ledBtn{
      border:1px solid #2c3350;
      background: #070812;
      color: var(--muted);
      padding:7px 10px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
      user-select:none;
      position:relative;
      transition: border-color .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .ledBtn::before{
      content:"";
      width:7px; height:7px; border-radius:999px;
      background: rgba(255,255,255,.10);
      box-shadow: 0 0 0 1px rgba(255,255,255,.10) inset;
      display:inline-block;
      margin-right:8px;
      vertical-align:middle;
    }
    .ledBtn.on{
      color: var(--text);
      border-color: rgba(58,130,255,.55);
      box-shadow: 0 0 0 1px rgba(58,130,255,.18) inset, 0 0 16px rgba(58,130,255,.10);
    }
    .ledBtn.on::before{
      background: rgba(58,130,255,.75);
      box-shadow: 0 0 12px rgba(58,130,255,.32), 0 0 0 1px rgba(58,130,255,.35) inset;
    }
    .masterMode .ledBtn.on{
      border-color: rgba(255,178,90,.62);
      box-shadow: 0 0 0 1px rgba(255,178,90,.20) inset, 0 0 16px rgba(255,178,90,.10);
    }
    .masterMode .ledBtn.on::before{
      background: rgba(255,178,90,.78);
      box-shadow: 0 0 14px rgba(255,178,90,.35), 0 0 0 1px rgba(255,178,90,.38) inset;
    }

    .notice{
      border:1px solid #2c3350;
      background: rgba(0,0,0,.10);
      padding:10px 12px;
      border-radius:14px;
      font-size:12px;
      color: var(--muted);
      line-height:1.35;
    }
    .notice strong{color:var(--text)}
    .notice.bad{border-color: rgba(255,107,107,.45); color:#ffd1d1}
    .notice.good{border-color: rgba(82,255,168,.35); color:#bfffdc}

    .checkboxRow{display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted)}
    input[type="checkbox"]{transform:scale(1.2)}

    .center{
      display:grid; place-items:center; text-align:center; gap:12px; padding:18px 14px;
    }
    .bigTitle{font-size:18px; font-weight:800; letter-spacing:.4px}
    .fade{opacity:.85}

    .hidden{display:none!important}
  </style>
</head>
<body>
  <div class="smoke"></div>

  <header>
    <div class="brand">
      <div class="title">
        <h1>G.C Studio Mix&Master</h1>
        <div class="sub">After Hours Studio Wizard • Suno / AI stems only • Mix → Health Scan → Master → One Render</div>
      </div>
      <div class="stepbar">
        <span class="led mix" id="stageLed"></span>
        <span id="stepText">Step 0 of 8</span>
      </div>
    </div>
  </header>

  <main>
    <section class="card" id="screen">
      <div class="rackEdge" id="rackEdge"></div>
      <div id="content"></div>

      <div class="row" style="margin-top:12px">
        <button class="btn" id="backBtn">Back</button>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          <span class="pill" id="pillLimits"><strong>Limits</strong> ≤75MB each • ≤5:00 • exact length match</span>
          <button class="btn primary" id="nextBtn">Next</button>
        </div>
      </div>
    </section>

    <section class="card" id="statusCard">
      <div class="row">
        <div style="display:grid; gap:6px">
          <div class="big">Session Status</div>
          <div class="muted" id="statusLine">Idle.</div>
        </div>
        <div style="min-width:320px; flex:1">
          <div class="muted">Progress</div>
          <div class="meter"><div id="bar"></div></div>
        </div>
      </div>
      <div class="grid" style="margin-top:10px">
        <div class="notice" id="reportBox">
          <strong>Report:</strong> Upload stems through the wizard to continue.
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  // ====== Locked Constraints ======
  const MAX_MB_PER_FILE = 75;
  const MAX_BYTES_PER_FILE = MAX_MB_PER_FILE * 1024 * 1024;
  const MAX_SECONDS = 5 * 60;
  const SR = 48000;

  // Exact match requirement (still needs tiny tolerance for decode variance)
  const DURATION_TOLERANCE_SEC = 0.02; // "exact" but practical

  // Bad stem thresholds
  const SILENT_RMS = Math.pow(10, -45/20);   // ~ -45 dBFS
  const CLIP_PEAK = 0.999;

  // ====== UI State ======
  const $ = (id) => document.getElementById(id);
  const content = $("content");
  const backBtn = $("backBtn");
  const nextBtn = $("nextBtn");
  const stepText = $("stepText");
  const statusLine = $("statusLine");
  const bar = $("bar");
  const reportBox = $("reportBox");
  const stageLed = $("stageLed");
  const rackEdge = $("rackEdge");
  const screen = $("screen");

  // Added HEALTH screen
  const SCREENS = {
    WELCOME: 0,
    HOW: 1,
    VOCALS: 2,
    DRUMS: 3,
    BASS: 4,
    INSTR: 5,
    OTHER: 6,
    REVIEW: 7,
    HEALTH: 8,
    OPTIONS: 9,
    CONFIRM: 10,
    RENDERING: 11,
    DONE: 12
  };

  let step = SCREENS.WELCOME;

  // One render only
  let renderedOnce = false;

  // Audio context for decoding (not for mixing)
  let decodeCtx = null;

  // Wizard buckets
  const buckets = {
    vocals: { label:"Vocals", required:true, min:1, max:3, files:[], buffers:[], tags:[] },
    drums:  { label:"Drums", required:true, min:1, max:1, files:[], buffers:[], tags:[] },
    bass:   { label:"Bass", required:true, min:1, max:1, files:[], buffers:[], tags:[] },
    instr:  { label:"Instruments", required:true, min:1, max:6, files:[], buffers:[], tags:[] },
    other:  { label:"Other / FX", required:true, min:1, max:3, files:[], buffers:[], tags:[] },
  };

  // Options
  const options = {
    genre: "trap",
    resultType: "mix_master", // mix_master | mix_only | master_only
    loudness: "safe",         // safe | loud
    rbVocal: "blend",         // blend | upfront (only R&B)
    trapBass: "trunk",        // trunk | tight (only Trap)
  };

  // ====== Mix Health Scan (Mastering Readiness Intelligence) ======
  const HEALTH_COPY = {
    lowEnd: `“Low end may be heavier than ideal.
This can cause distortion or loss of punch on smaller systems.”`,
    treble: `“High frequencies may sound harsh on loud playback.”`,
    dynamics: `“This mix has limited dynamics.
Loudness may increase, but impact may not.”`,
    stereo: `“The stereo image is narrow.
This can make the mix feel crowded.”`,
    phase: `“Phase issues detected.
Bass impact may reduce in mono playback.”`,
    vocals: `“Vocals may not sit clearly in the mix.”`,
  };

  const health = {
    results: null,
    toneStage: "clean",     // clean | warm | punch (internal only)
    masterType: "song",     // beat | song (internal only)
    fixes: {
      lowEnd: "ask",        // ask|apply|skip
      treble: "ask",
      dynamics: "ask",
      stereo: "ask",
      phase: "ask",
      vocals: "ask",
    }
  };

  // ====== Helpers ======
  function setProgress(p){ bar.style.width = `${Math.round(Math.max(0, Math.min(1, p)) * 100)}%`; }
  function setStatus(t){ statusLine.textContent = t; }
  function setReport(html, kind=""){
    reportBox.classList.remove("bad","good");
    if(kind) reportBox.classList.add(kind);
    reportBox.innerHTML = html;
  }
  function setStage(mode){ // "mix" | "master" | "bad"
    stageLed.classList.remove("mix","master","bad");
    rackEdge.classList.remove("master");
    screen.classList.remove("masterMode");
    if(mode==="master"){
      stageLed.classList.add("master");
      rackEdge.classList.add("master");
      screen.classList.add("masterMode");
    } else if(mode==="bad"){
      stageLed.classList.add("bad");
    } else {
      stageLed.classList.add("mix");
    }
  }

  function fmtSec(sec){
    const m = Math.floor(sec/60);
    const s = Math.round(sec - m*60);
    return `${m}:${String(s).padStart(2,"0")}`;
  }
  function bytesToMB(b){ return (b/1024/1024).toFixed(1); }

  function guessInstrTag(filename){
    const n = (filename||"").toLowerCase();
    if (n.includes("piano") || n.includes("key") || n.includes("keyboard") || n.includes("keys")) return "keyboard";
    if (n.includes("pad") || n.includes("atmo") || n.includes("atmos")) return "pad";
    if (n.includes("guitar")) return "guitar";
    if (n.includes("synth") || n.includes("lead") || n.includes("pluck")) return "synth";
    return "other";
  }

  function warnIfLooksLikeFullMix(file){
    const n = (file.name||"").toLowerCase();
    if(n.includes("mix") || n.includes("master") || n.includes("fullsong") || n.includes("full_song")){
      return `This looks like a full mix/master (“${file.name}”). Please upload stems only.`;
    }
    return null;
  }

  async function ensureDecodeCtx(){
    if(!decodeCtx) decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(decodeCtx.state === "suspended") await decodeCtx.resume();
  }

  function computeRMS(ch){
    let s=0;
    for(let i=0;i<ch.length;i++){ const v=ch[i]; s += v*v; }
    return Math.sqrt(s / ch.length);
  }
  function computePeak(ch){
    let p=0;
    for(let i=0;i<ch.length;i++){ const a = Math.abs(ch[i]); if(a>p) p=a; }
    return p;
  }
  function analyzeBuffer(buf){
    const ch0 = buf.getChannelData(0);
    const rms = computeRMS(ch0);
    const peak = computePeak(ch0);
    return { rms, peak, duration: buf.duration, channels: buf.numberOfChannels, sampleRate: buf.sampleRate };
  }

  function allLoaded(){
    return Object.values(buckets).every(b => b.files.length >= b.min && b.files.length <= b.max);
  }

  function allInstrTagged(){
    if (buckets.instr.files.length === 0) return false;
    return buckets.instr.tags.length === buckets.instr.files.length &&
           buckets.instr.tags.every(t => !!t);
  }

  function clearBucket(key){
    buckets[key].files = [];
    buckets[key].buffers = [];
    buckets[key].tags = [];
  }

  function resetAll(){
    Object.keys(buckets).forEach(clearBucket);
    options.genre = "trap";
    options.resultType = "mix_master";
    options.loudness = "safe";
    options.rbVocal = "blend";
    options.trapBass = "trunk";
    renderedOnce = false;

    // reset health
    health.results = null;
    health.toneStage = "clean";
    health.masterType = "song";
    Object.keys(health.fixes).forEach(k => health.fixes[k] = "ask");

    setProgress(0);
    setStage("mix");
    setStatus("Idle.");
    setReport(`<strong>Report:</strong> Upload stems through the wizard to continue.`);
    go(SCREENS.WELCOME);
  }

  // ====== Validation across all stems (exact duration match, etc.) ======
  function validateAllStems(){
    if(!allLoaded()){
      return { ok:false, msg:"Missing required stem categories." };
    }
    if(!allInstrTagged()){
      return { ok:false, msg:"Tag every instrument file (Keyboard/Synth/Pad/Guitar/Other) before continuing." };
    }

    const durations = [];
    for(const b of Object.values(buckets)){
      for(let i=0;i<b.buffers.length;i++){
        durations.push(b.buffers[i].duration);
      }
    }
    const minD = Math.min(...durations);
    const maxD = Math.max(...durations);
    if ((maxD - minD) > DURATION_TOLERANCE_SEC){
      return { ok:false, msg:`All stems must be the exact same length. Detected ${fmtSec(minD)} to ${fmtSec(maxD)}.` };
    }
    if (maxD > MAX_SECONDS + 0.01){
      return { ok:false, msg:`A stem is longer than 5:00 (${fmtSec(maxD)}). Please trim and re-export.` };
    }

    for(const b of Object.values(buckets)){
      for(let i=0;i<b.buffers.length;i++){
        const a = analyzeBuffer(b.buffers[i]);
        if (a.rms < SILENT_RMS){
          return { ok:false, msg:`“${b.files[i].name}” appears silent/near-silent. Re-export that stem.` };
        }
        if (a.peak >= CLIP_PEAK){
          return { ok:false, msg:`“${b.files[i].name}” is heavily clipped. Re-export for best results.` };
        }
      }
    }

    return { ok:true, msg:`Stems validated: ${fmtSec((minD+maxD)/2)} total length.` };
  }

  // ====== Render UI ======
  function wizardShell(title, subtitle, innerHtml){
    return `
      <div class="grid">
        <div class="row">
          <div style="display:grid; gap:6px">
            <div class="big">${title}</div>
            <div class="muted">${subtitle}</div>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center">
            <span class="pill"><strong>Mode</strong> AI Stems</span>
            <span class="pill"><strong>Baseline</strong> -6 dB Mix Bus Peak</span>
          </div>
        </div>
        ${innerHtml}
      </div>
    `;
  }

  function uploadSlotHtml(key, stepNum, stepTotal, allowMulti, examples){
    const b = buckets[key];
    const filesHtml = b.files.length ? `
      <div class="fileList">
        ${b.files.map((f, idx) => {
          const buf = b.buffers[idx];
          const a = buf ? analyzeBuffer(buf) : null;
          const warn = warnIfLooksLikeFullMix(f);
          return `
            <div class="fileRow">
              <div class="fileMeta">
                <div class="name">${f.name}</div>
                <div class="submeta">
                  ${bytesToMB(f.size)} MB • ${a ? fmtSec(a.duration) : "…"} • ${a ? `${a.channels}ch` : ""}${warn ? ` • <span style="color:var(--bad)">looks like full mix</span>` : ""}
                </div>
              </div>
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
                <span class="pill good"><strong>READY</strong></span>
                <button class="btn danger" data-action="remove" data-key="${key}" data-idx="${idx}">Remove</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    ` : `<div class="notice"><strong>Insert Stem:</strong> ${examples}</div>`;

    return wizardShell(
      `Step ${stepNum} of ${stepTotal} — ${b.label}`,
      `Required. ${allowMulti ? `Upload ${b.min}–${b.max} files.` : `Upload ${b.min} file.`} Max ${MAX_MB_PER_FILE}MB each. ≤ 5:00. Exact match length.`,
      `
        <div class="slot">
          <div class="slotTop">
            <div class="slotName">
              <span class="led mix" style="width:9px;height:9px"></span>
              <div class="label">${b.label} Module</div>
            </div>
            <div class="slotHint">${allowMulti ? "Multi-file allowed" : "Single file required"}</div>
          </div>

          <div>
            <input type="file" id="fileInput_${key}" ${allowMulti ? "multiple" : ""} accept="audio/*" />
            <div class="muted" style="margin-top:6px">${examples}</div>
          </div>

          ${filesHtml}

          <div class="notice ${b.files.length>=b.min ? "good":"bad"}">
            <strong>Status:</strong>
            ${b.files.length>=b.min ? `Loaded (${b.files.length})` : `Missing — required`}
          </div>
        </div>
      `
    );
  }

  function instrumentsTagHtml(){
    const b = buckets.instr;

    const list = b.files.length ? b.files.map((f, idx) => {
      const current = b.tags[idx] || "";
      const setBtn = (value, label) => `
        <span class="ledBtn ${current===value ? "on":""}" data-action="tag" data-idx="${idx}" data-value="${value}">
          ${label}
        </span>
      `;
      return `
        <div class="fileRow">
          <div class="fileMeta">
            <div class="name">${f.name}</div>
            <div class="submeta">${bytesToMB(f.size)} MB • ${b.buffers[idx] ? fmtSec(b.buffers[idx].duration) : "…"} • TYPE: <span class="mono">${current || "UNSET"}</span></div>
          </div>
          <div class="ledBtns">
            ${setBtn("keyboard","Keyboard")}
            ${setBtn("synth","Synth")}

  async function handleFilesForBucket(key, fileList){
    const b = buckets[key];
    const files = Array.from(fileList || []);
    if(!files.length) return;

    if (files.length + b.files.length > b.max){
      throw new Error(`${b.label}: You can upload up to ${b.max} file(s) here.`);
    }

    await ensureDecodeCtx();
    for(const f of files){
      if (f.size > MAX_BYTES_PER_FILE){
        throw new Error(`"${f.name}" is ${bytesToMB(f.size)}MB. Max is ${MAX_MB_PER_FILE}MB.`);
      }
      if (!f.type || !f.type.toLowerCase().startsWith("audio/")){
        throw new Error(`"${f.name}" isn't recognized as audio.`);
      }
      const mixWarn = warnIfLooksLikeFullMix(f);
      if (mixWarn) throw new Error(mixWarn);
    }

    for(let i=0;i<files.length;i++){
      const f = files[i];
      setStatus(`Decoding: ${b.label} — ${f.name}`);
      setProgress(0.08);

      let ab;
      try { ab = await f.arrayBuffer(); } catch(e){
        throw new Error(`Couldn't read "${f.name}". Try WAV or MP3.`);
      }

      let buf;
      try { buf = await decodeCtx.decodeAudioData(ab.slice(0)); }
      catch(e){ throw new Error(`Couldn't open "${f.name}". Convert to WAV or MP3 and try again.`); }

      if (buf.duration > MAX_SECONDS + 0.01){
        throw new Error(`"${f.name}" is longer than 5:00 (${fmtSec(buf.duration)}). Trim and re-export.`);
      }

      const a = analyzeBuffer(buf);
      if (a.rms < SILENT_RMS) throw new Error(`"${f.name}" appears silent/near-silent. Re-export that stem.`);
      if (a.peak >= CLIP_PEAK) throw new Error(`"${f.name}" is clipped. Re-export that stem.`);

      b.files.push(f);
      b.buffers.push(buf);

      if (key === "instr"){
        b.tags.push(guessInstrTag(f.name));
      }
    }

    health.results = null;
    Object.keys(health.fixes).forEach(k => health.fixes[k] = "ask");

    setStatus("Decoded.");
    setProgress(0);
    go(step);
  }

  function removeFile(key, idx){
    const b = buckets[key];
    b.files.splice(idx,1);
    b.buffers.splice(idx,1);
    b.tags.splice(idx,1);
    health.results = null;
    Object.keys(health.fixes).forEach(k => health.fixes[k] = "ask");
    go(step);
  }

  document.addEventListener("click", async (e) => {
    const t = e.target;
    if(!(t instanceof HTMLElement)) return;

    if(t.dataset.action === "remove"){
      removeFile(t.dataset.key, Number(t.dataset.idx));
      return;
    }

    if(t.dataset.action === "tag"){
      const idx = Number(t.dataset.idx);
      const val = t.dataset.value;
      buckets.instr.tags[idx] = val;
      health.results = null;
      go(step);
      return;
    }

    if(t.dataset.action === "rbVocal"){
      options.rbVocal = t.dataset.value;
      go(SCREENS.OPTIONS);
      return;
    }
    if(t.dataset.action === "trapBass"){
      options.trapBass = t.dataset.value;
      go(SCREENS.OPTIONS);
      return;
    }

    if(t.dataset.action === "fix"){
      const fix = t.dataset.fix;
      const val = t.dataset.value; // apply|skip
      health.fixes[fix] = val;
      go(SCREENS.HEALTH);
      return;
    }
  });

  document.addEventListener("change", async (e) => {
    const t = e.target;
    if(!(t instanceof HTMLInputElement)) return;
    if(t.type !== "file") return;

    const id = t.id || "";
    const key = id.replace("fileInput_","");
    if(!buckets[key]) return;

    try{
      if (buckets[key].max === 1) clearBucket(key);
      await handleFilesForBucket(key, t.files);
      t.value = "";
    }catch(err){
      setStage("bad");
      setReport(`<strong>Upload blocked:</strong> ${err.message}`, "bad");
      setStatus("Upload blocked.");
      setProgress(0);
      t.value = "";
      setTimeout(() => updateChrome(), 300);
    }
  });

      setReport(`<strong>Report:</strong> Build loaded. Rendering function is present in your earlier version and can be re-added here.`, "good");
    }
  };

  async function runMixHealthScan(){
    setStatus("Running Mix Health Scan…");
    setProgress(0.12);
    setReport(`<strong>Report:</strong> Running Mix Health Scan…`, "");

    const list = mergeBuffersList();
    const dur = list[0].buffer.duration;
    const sliceSec = Math.min(20, dur);
    const frames = Math.floor(sliceSec * SR);

    const oac = new OfflineAudioContext(2, frames, SR);
    const mix = oac.createGain();
    mix.gain.value = 1.0;
    mix.connect(oac.destination);

    for(const item of list){
      const src = oac.createBufferSource();
      src.buffer = item.buffer;
      const g = oac.createGain(); g.gain.value = 1.0;
      src.connect(g); g.connect(mix);
      src.start(0);
    }

    const preview = await oac.startRendering();
    setProgress(0.30);

    function analyzeRendered(buf){
      const ch0 = buf.getChannelData(0);
      const rms = computeRMS(ch0);
      const peak = computePeak(ch0);
      const crest = peak/(rms+1e-9);
      return { rms, peak, crest };
    }

    async function bandEnergy(type, freq, q=0.7){
      const o = new OfflineAudioContext(1, frames, SR);
      const s = o.createBufferSource(); s.buffer = preview;

      const split = o.createChannelSplitter(2);
      const l = o.createGain(); l.gain.value = 0.5;
      const r = o.createGain(); r.gain.value = 0.5;
      const sum = o.createGain(); sum.gain.value = 1.0;

      const f = o.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;

      s.connect(split);
      split.connect(l,0); split.connect(r,1);
      l.connect(sum); r.connect(sum);
      sum.connect(f);
      f.connect(o.destination);

      s.start(0);
      const out = await o.startRendering();
      const ch = out.getChannelData(0);
      let e=0;
      for(let i=0;i<ch.length;i++){ const v=ch[i]; e += v*v; }
      return e/ch.length;
    }

    function midSide(buf){
      const L = buf.getChannelData(0);
      const R = buf.getChannelData(1);
      let midE=0, sideE=0;
      for(let i=0;i<L.length;i++){
        const m=(L[i]+R[i])*0.5;
        const s=(L[i]-R[i])*0.5;
        midE += m*m;
        sideE += s*s;
      }
      midE/=L.length; sideE/=L.length;
      return { sideRatio: sideE/(midE+1e-9) };
    }

    function corr(buf){
      const L = buf.getChannelData(0);
      const R = buf.getChannelData(1);
      let sumLR=0,sumL2=0,sumR2=0;
      for(let i=0;i<L.length;i++){
        const l=L[i], r=R[i];
        sumLR += l*r; sumL2 += l*l; sumR2 += r*r;
      }
      return sumLR/(Math.sqrt(sumL2*sumR2)+1e-9);
    }

    const dyn = analyzeRendered(preview);
    const subE   = await bandEnergy("lowpass", 90, 0.7);    setProgress(0.46);
    const lowMid = await bandEnergy("peaking", 250, 1.0);   setProgress(0.56);
    const harshE = await bandEnergy("peaking", 3800, 1.2);  setProgress(0.66);
    const airE   = await bandEnergy("highpass", 9000, 0.7); setProgress(0.76);

    const ms = midSide(preview);
    const c = corr(preview);

    const flags = {
      lowEnd:   (subE > airE*6.0) || (lowMid > airE*4.0),
      treble:   (airE > subE*1.35) || (harshE > subE*1.05),
      dynamics: (dyn.crest < 1.75),
      stereo:   (ms.sideRatio < 0.10),
      phase:    (c < 0.15),
      vocals:   false
    };

    let toneStage = "clean";
    let toneStageNote = "Clean / Transparent Stage — mix looks stable. No color. Just control + polish.";
    const thin = (lowMid < airE * 0.85);
    if(thin && !flags.treble){
      toneStage = "warm";
      toneStageNote = "Warm / Tube-Style Stage — mix feels thin/sterile. Adds subtle harmonic density (conditional, not global).";
    }
    if(flags.dynamics && !flags.lowEnd){
      toneStage = "punch";
      toneStageNote = "Punch / Console-Style Stage — dynamics are flat. Restores impact without flattening.";
    }

    health.results = { flags, toneStageNote };
    health.toneStage = toneStage;

    setProgress(1);
    setStatus("Mix Health Scan complete.");
    setReport(`<strong>Report:</strong> Mix Health Scan complete. Choose which fixes to apply (optional).`, "good");
  }

  function mergeBuffersList(){
    const list = [];
    buckets.vocals.buffers.forEach((buf, i) => list.push({ role:"vocals", buffer:buf }));
    buckets.drums.buffers.forEach((buf, i) => list.push({ role:"drums", buffer:buf }));
    buckets.bass.buffers.forEach((buf, i) => list.push({ role:"bass", buffer:buf }));
    buckets.instr.buffers.forEach((buf, i) => list.push({ role:"instr", buffer:buf, instrTag:buckets.instr.tags[i] }));
    buckets.other.buffers.forEach((buf, i) => list.push({ role:"other", buffer:buf }));
    return list;
  }

  // Boot
  backBtn.textContent = "Back";
  nextBtn.textContent = "Next";
  go(SCREENS.WELCOME);

  window.gcStudioReset = resetAll;
})();
</script>
